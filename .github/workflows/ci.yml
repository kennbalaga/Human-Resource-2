name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, intl, curl, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Audit PHP dependencies
        run: composer audit

      # Every Blade page extends a layout that calls @vite, so the pages the
      # feature tests render need a real manifest to resolve. public/build is a
      # gitignored build artifact and the frontend job compiles it on a separate
      # runner, so this job has to build the assets itself — without them the
      # whole feature suite dies on ViteManifestNotFoundException.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        run: php artisan test

  php-tests-mysql:
    name: PHP tests (MySQL)
    runs-on: ubuntu-latest

    # The default suite runs on in-memory SQLite for speed, but production is
    # MySQL. Driver differences (JSON path predicates, strict-mode column and
    # date handling, index limits) are invisible to a SQLite-only run, so the
    # same suite is replayed here against the engine the application actually
    # ships on.
    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, mysqli, gd, fileinfo, intl, curl, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # phpunit.xml declares DB_CONNECTION/DB_DATABASE without force="true", so
      # a real environment variable takes precedence over the SQLite defaults.
      - name: Run test suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit

      - name: Build frontend assets
        run: npm run build

  # One status for branch protection to require, so adding or renaming a job
  # above never means editing the protection rule. always() makes it report a
  # failure instead of being skipped when a job it needs fails.
  ci-passed:
    name: CI passed
    if: always()
    needs: [php-tests, php-tests-mysql, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Check every CI job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job finished with '$result'."
              exit 1
            fi
          done
